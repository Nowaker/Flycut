<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flycut history</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
	<h1>Flycut history</h1>
	<nav id="lists">
		<button type="button" data-list="0" class="active">History</button>
		<button type="button" data-list="1">Favorites</button>
	</nav>
	<input id="search" type="search" placeholder="Search clippings  ( / )" autocomplete="off" spellcheck="false">
	<select id="machine"><option value="">All machines</option></select>
	<form method="post" action="logout"><button type="submit" class="quiet">Sign out</button></form>
</header>
<main>
	<section id="list-pane">
		<p id="count"></p>
		<ol id="clippings"></ol>
		<button type="button" id="more" hidden>Load more</button>
	</section>
	<section id="detail" aria-live="polite">
		<p class="placeholder">Choose a clipping.</p>
	</section>
</main>
</body>
</html>
