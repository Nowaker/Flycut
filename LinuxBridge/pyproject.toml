[project]
name = "flycut-linux-bridge"
version = "1.0.0"
description = "Durable Flycut archive and opt-in sync for GPaste and KDE Klipper"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "typer>=0.16,<1", "httpx2[http2,brotli,zstd]>=2.13.1,<3", "jeepney>=0.9,<0.10"]

[project.scripts]
flycut-bridge = "flycut_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flycut_bridge"]

[dependency-groups]
dev = ["basedpyright>=1.31", "ruff>=0.12"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
stubPath = "typings"
include = ["flycut_bridge", "qa.py", "service_qa.py", "manager_qa.py"]
reportUnusedCallResult = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "CPY001", "D101", "D102", "D103", "D105", "D107", "FBT001", "FBT002", "FBT003", "PLR2004", "ISC003", "TRY003", "EM101", "EM102"]

[tool.ruff.lint.per-file-ignores]
"flycut_bridge/cli.py" = ["B008", "T201", "PLR0913", "PLR0917"]
"qa.py" = ["T201", "PLR0915"]
"service_qa.py" = ["T201", "PLR0915"]
"manager_qa.py" = ["T201"]
"typings/**/*.pyi" = ["N818"]
